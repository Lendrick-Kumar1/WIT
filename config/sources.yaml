# sources.yaml: where reports come from. Fill in on the org laptop.
# (The values below point at the bundled demo tree so you can try it right away.)

deal_list:
  path: demo/active_deals.xlsx          # <<org path to the active-deals Excel>>
  sheet: 0
  columns:
    deal: "Deal Name"                   # <<column holding the deal name>>
    trustee: "Trustee"                  # <<column holding the trustee>>
    folder: "Deal Name"                 # column whose value equals the deal's folder name
  filter: {}                            # e.g. {Status: Active}

reports_root: demo/reports              # <<org reports root>>

# report-type folders inside each deal folder, in PRIORITY order (first with a file wins)
report_folders: ["Monthly Trustee Report", "Quarterly Trustee Report", "Intra Trustee Report"]

# how a file name encodes the period; {yyyy} {m} {mm} are filled from --period 2026-08
file_period_regex: "(?<!\\d){yyyy}[_-]0?{m}(?!\\d)"
