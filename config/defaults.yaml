# Global defaults, identical on every machine. No page coordinates and no machine-specific values here.
# Per-machine overrides: config/local.yaml (git-ignored; start from config/local.example.yaml) or env vars:
#   DOCLING_ARTIFACTS_PATH, TE_REPORTS_DIR, TE_WORKERS, TE_THREADS, TE_YOLO_WEIGHTS

paths:
  reports: reports                 # relative to the repo root, or absolute
  cache: data/cache
  golden_manifest: data/golden/manifest.yaml

runtime:
  workers: 1                       # Docling worker processes. 16 GB machines: 1; `cli doctor` says when 2 is safe
  threads_per_worker: null         # null = physical cores // workers
  worker_peak_ram_gb: 1.1          # last measured peak per worker (bny_1, full Docling); `cli doctor --measure`
  min_free_ram_gb_for_2_workers: 8

docling:
  artifacts_path: ~/.cache/docling/models   # models are never downloaded at runtime (HF_HUB_OFFLINE=1)
  layout_preset: layout_egret_large  # layout_egret_medium | layout_egret_large | layout_egret_xlarge | layout_heron_default
  do_ocr: false                    # born-digital PDFs: text comes from the PDF text layer
  table_mode: accurate             # accurate | fast
  do_cell_matching: true           # map PDF words onto predicted cells

routing:
  # Geometry structure is the default (long tables). TableFormer runs only for these cases, on the (sub-)box crop.
  tableformer_on: [dashboard_page, validation_failure]

yolo:
  weights: models/yolo/best.pt     # fetched from a GitHub Release (docs/SETUP.md); optional

labelstudio:
  render_dpi: 144
  classes: [table, table_title, section_header, key_value_block]
