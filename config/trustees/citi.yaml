# Citi (Virtus / FIS reporting): orange title bars, 2x2 dashboard summary page.
names: "Citi|Citibank|Virtus"          # matches the Trustee column of the deal list
detect:
  any: ["citicorp|citibank|citi\\b", "virtus", "Monthly Report As Of"]
pages:
  performance: ["Summary Page", "Portfolio Profile Test Summary", "Additional Limitations Summary",
                "Par Value Tests", "Interest Coverage Tests"]
  balance:     ["Summary Page", "Par Value Tests"]
  collateral:  ["Collateral Detail", "Ratings Detail"]
balance:
  labels:
    principal balance: ["<<PLACEHOLDER>>"]
    default balance:   ["<<PLACEHOLDER>>"]
    proceeds balance:  ["<<PLACEHOLDER>>"]
    ccc balance:       ["<<PLACEHOLDER>>"]
