# wilmington: PLACEHOLDER. Fill from the legacy repo, then set enabled: true.
# Only put what DIFFERS from defaults.yaml. Everything is text/regex, never coordinates.

enabled: false   # set true once detect + pages are filled in

names: "<<regex matching this trustee in the deal-list Trustee column>>"

detect:                       # only needed when a trustee has several layouts: picks among them
  all: ["<<text that ALWAYS appears, e.g. trustee website>>"]
  any: ["<<extra hints, e.g. a section title typical for this trustee>>"]

layout:
  title_band: 0.2             # raise if this trustee's page titles sit lower on the page

pages:                        # paste the legacy key terms here (regex). Empty = scan all pages.
  match_on: title             # title = page section title (top band); text = anywhere on page
  performance: ["<<e.g. Executive Summary>>", "<<e.g. Compliance Tests>>"]
  balance:     ["<<page title where balances are printed>>"]
  collateral:  ["<<e.g. Detail of Assets>>", "<<e.g. Ratings Detail>>"]

balance:
  labels:                     # field -> label(s) as printed in this trustee's reports
    principal balance: ["<<label>>"]
    default balance:   ["<<label>>"]
    proceeds balance:  ["<<label>>"]
    ccc balance:       ["<<label>>"]

# performance:                # only if this trustee uses unusual header words
#   header_roles:
#     trigger: "threshold|trigger|<<their word>>"

# collateral:                 # only if this trustee uses unusual column headers
#   columns:
#     loan id: "lxid|isin|<<their word>>"
