[project]
name = "wit"
version = "0.1.0"
description = ""
authors = [
    {name = "Gokul RS",email = "gokulrsofficial@gmail.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "docling (>=2.135.0,<3.0.0)",
    "pymupdf (>=1.28.2,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "psutil (>=7.2.2,<8.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "ttkbootstrap (==1.10.1)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "trustee_extract", from = "src"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs real Docling models"]
addopts = "-m 'not slow'"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
